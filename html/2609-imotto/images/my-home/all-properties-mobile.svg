<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1050" viewBox="0 0 360 1050" role="img" aria-labelledby="title desc">
  <title id="title">物件探しの相談窓口の比較</title>
  <desc id="desc">一般的には物件ごとにA社、B社、C社へ問い合わせます。アイモットなら3つの物件をまとめて一つの窓口へ相談できます。</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#153a55}
      .head{font-size:24px;font-weight:800}
      .sub{font-size:14px;fill:#536c7c}
      .item{font-size:17px;font-weight:800}
      .small{font-size:13px;fill:#536c7c}
      .company{font-size:16px;font-weight:800}
      .white{fill:#fff}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#c59652"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="358" height="492" rx="22" fill="#f3f7fa" stroke="#dbe7ee"/>
  <text x="180" y="47" text-anchor="middle" class="head">一般的な物件探し</text>
  <text x="180" y="75" text-anchor="middle" class="sub">物件ごとに別々の会社へ問い合わせ</text>

  <g transform="translate(18 103)">
    <rect width="324" height="104" rx="15" fill="#fff" stroke="#dce7ec"/>
    <path d="M20 47 L43 27 L66 47 V76 H20 Z M35 76 V54 H51 V76" fill="#f5e9d5" stroke="#ae8a56" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="83" y="43" class="item">物件 1</text><text x="83" y="68" class="small">SUUMOに掲載</text>
    <path d="M218 52 H238" stroke="#c59652" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="251" y="30" width="56" height="47" rx="12" fill="#e8eef3"/>
    <text x="279" y="59" text-anchor="middle" class="company">A社</text>
  </g>
  <g transform="translate(18 221)">
    <rect width="324" height="104" rx="15" fill="#fff" stroke="#dce7ec"/>
    <path d="M20 47 L43 27 L66 47 V76 H20 Z M35 76 V54 H51 V76" fill="#f5e9d5" stroke="#ae8a56" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="83" y="43" class="item">物件 2</text><text x="83" y="68" class="small">SUUMOに掲載</text>
    <path d="M218 52 H238" stroke="#c59652" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="251" y="30" width="56" height="47" rx="12" fill="#e8eef3"/>
    <text x="279" y="59" text-anchor="middle" class="company">B社</text>
  </g>
  <g transform="translate(18 339)">
    <rect width="324" height="104" rx="15" fill="#fff" stroke="#dce7ec"/>
    <path d="M20 47 L43 27 L66 47 V76 H20 Z M35 76 V54 H51 V76" fill="#f5e9d5" stroke="#ae8a56" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="83" y="43" class="item">物件 3</text><text x="83" y="68" class="small">HOME'Sに掲載</text>
    <path d="M218 52 H238" stroke="#c59652" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="251" y="30" width="56" height="47" rx="12" fill="#e8eef3"/>
    <text x="279" y="59" text-anchor="middle" class="company">C社</text>
  </g>
  <text x="180" y="522" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#c66d32">窓口を一つにすると…</text>
  <path d="M180 535 V563" stroke="#c59652" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1" y="580" width="358" height="469" rx="22" fill="#fbf5e9" stroke="#e4d7bf"/>
  <text x="180" y="628" text-anchor="middle" class="head">アイモットなら</text>
  <text x="180" y="656" text-anchor="middle" class="sub">気になる物件をまとめて相談</text>

  <g transform="translate(18 682)">
    <rect width="324" height="57" rx="12" fill="#fff" stroke="#e4d7bf"/>
    <text x="20" y="35" class="item">物件 1</text><text x="109" y="35" class="small">SUUMOに掲載</text>
  </g>
  <g transform="translate(18 750)">
    <rect width="324" height="57" rx="12" fill="#fff" stroke="#e4d7bf"/>
    <text x="20" y="35" class="item">物件 2</text><text x="109" y="35" class="small">SUUMOに掲載</text>
  </g>
  <g transform="translate(18 818)">
    <rect width="324" height="57" rx="12" fill="#fff" stroke="#e4d7bf"/>
    <text x="20" y="35" class="item">物件 3</text><text x="109" y="35" class="small">HOME'Sに掲載</text>
  </g>
  <path d="M180 882 V902" stroke="#c59652" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="35" y="912" width="290" height="63" rx="15" fill="#163b56"/>
  <text x="180" y="951" text-anchor="middle" class="white" style="font-size:20px;font-weight:800">不動産のアイモット</text>
  <text x="180" y="1006" text-anchor="middle" style="font-size:15px;font-weight:700">楠本代表にまとめて相談</text>
</svg>
